<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ea580c" />
        <meta
            name="description"
            content="Eat & Amare – discover, share and save your favourite recipes."
        />
        <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <script>
            // Apply the saved theme before first paint to avoid a light/dark flash
            try {
                var saved = localStorage.getItem("darkMode");
                var dark = saved !== null
                    ? JSON.parse(saved)
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (dark) document.documentElement.classList.add("dark");
            } catch (e) {}
        </script>
        <title>Eat & Amare</title>
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
